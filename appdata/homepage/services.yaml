---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/services/
#
# The whole dashboard is defined here rather than as homepage.* labels on each
# compose service. See .plans/homepage-widgets.md for the reasoning.
#
# Do NOT re-add homepage.* labels to the compose files. Label discovery and this
# file are independent mechanisms - running both renders every service twice.
#
# server: my-docker  -> matches appdata/homepage/docker.yaml
# container: <name>  -> provides the status dot, and container stats on click
#
# {{HOMEPAGE_VAR_X}} is substituted from an env var of that name, passed into
# the homepage container in compose/homepage.yml. Keys stay out of git.

- Media:
    - Jellyfin:
        icon: jellyfin.png
        href: https://jellyfin.{{HOMEPAGE_VAR_DOMAIN}}
        description: Media Server
        server: my-docker
        container: jellyfin
        widget:
          type: jellyfin
          url: http://jellyfin:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          enableBlocks: false
          enableNowPlaying: false

    - TV Tuner:
        icon: hdhomerun.png
        href: http://{{HOMEPAGE_VAR_TV_TUNER}}
        description: Live TV Tuner
        widget:
          type: customapi
          url: http://{{HOMEPAGE_VAR_TV_TUNER}}/status.json
          display: list
          mappings:
            - field: 0.VctNumber
              label: Tuner 0
              additionalField:
                field: 0.SignalQualityPercent
            - field: 1.VctNumber
              label: Tuner 1
              additionalField:
                field: 1.SignalQualityPercent
            - field: 2.VctNumber
              label: Tuner 2
              additionalField:
                field: 2.SignalQualityPercent
            - field: 3.VctNumber
              label: Tuner 3
              additionalField:
                field: 3.SignalQualityPercent

- PVR:
    - Radarr:
        icon: radarr.png
        href: https://radarr.{{HOMEPAGE_VAR_DOMAIN}}
        description: Movie Management
        server: my-docker
        container: radarr
        widget:
          type: radarr
          url: http://radarr:7878
          key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
          fields: ["missing", "queued"]
          highlight:
            missing:
              numeric:
                - level: warn
                  when: gt
                  value: 0

    - Sonarr:
        icon: sonarr.png
        href: https://sonarr.{{HOMEPAGE_VAR_DOMAIN}}
        description: TV Management
        server: my-docker
        container: sonarr
        widget:
          type: sonarr
          url: http://sonarr:8989
          key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
          fields: ["wanted", "queued"]
          highlight:
            wanted:
              numeric:
                - level: warn
                  when: gt
                  value: 0

- Downloads:
    - SABnzbd:
        icon: sabnzbd.png
        href: https://sabnzbd.{{HOMEPAGE_VAR_DOMAIN}}
        description: Usenet Downloader
        server: my-docker
        container: sabnzbd
        widget:
          type: sabnzbd
          url: http://sabnzbd:8080
          key: "{{HOMEPAGE_VAR_SABNZBD_KEY}}"
          fields: ["rate", "queue"]

- Monitoring:
    - Grafana:
        icon: grafana.png
        href: https://grafana.{{HOMEPAGE_VAR_DOMAIN}}
        description: Dashboards
        server: my-docker
        container: grafana

- Management:
    - Authentik:
        icon: authentik.png
        href: https://auth.{{HOMEPAGE_VAR_DOMAIN}}
        description: SSO / Identity
        server: my-docker
        container: authentik

    - Traefik:
        icon: traefik.png
        href: https://traefik.{{HOMEPAGE_VAR_DOMAIN}}
        description: Reverse Proxy
        server: my-docker
        container: traefik

    - Portainer:
        icon: portainer.png
        href: https://portainer.{{HOMEPAGE_VAR_DOMAIN}}/
        description: Container Management
        server: my-docker
        container: portainer

    - Dozzle:
        icon: dozzle.png
        href: https://dozzle.{{HOMEPAGE_VAR_DOMAIN}}
        description: Container Logs
        server: my-docker
        container: dozzle
