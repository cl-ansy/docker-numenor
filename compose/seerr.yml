services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    networks:
      - t3_proxy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # ports:
    #   - 5055:5055
    environment:
      - LOG_LEVEL=info
      - TZ=$TZ
    volumes:
      - $DOCKERDIR/appdata/seerr:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.http.routers.seerr-rtr.entrypoints=websecure
      - traefik.http.routers.seerr-rtr.rule=Host(`seerr.$DOMAINNAME`)
      - traefik.http.routers.seerr-rtr.service=seerr-svc
      - traefik.http.routers.seerr-rtr.middlewares=chain-no-auth@file
      - traefik.http.services.seerr-svc.loadbalancer.server.port=5055
