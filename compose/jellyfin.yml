# Jellyfin - Media Server
# OAuth config: https://docs.goauthentik.io/integrations/services/jellyfin/#oidc-configuration
services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    networks:
      - t3_proxy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    user: $PUID:$PGID
    # ports:
    #   - "8096:8096" # HTTP
    #   - "8920:8920" # HTTPS
    environment:
      UMASK_SET: 022
      TZ: $TZ
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "105"
    volumes:
      - $DOCKERDIR/appdata/jellyfin:/config
      - $SHAREDDIR/media:/data/media
      - $DOWNLOADSDIR:/data/downloads
      # jellyfin-ffmpeg's bundled libva ignores LIBVA_DRIVERS_PATH; it's
      # hardcoded to /usr/lib/jellyfin-ffmpeg/lib. Overlay the built driver
      # directly on top of the bundled (SIGBUS-crashing) one instead.
      - $IHDDIR/iHD_drv_video.so:/usr/lib/jellyfin-ffmpeg/lib/dri/iHD_drv_video.so:ro
      - $IHDDIR/libigdgmm.so.12.10.0:/usr/lib/jellyfin-ffmpeg/lib/libigdgmm.so.12.9.0:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.jellyfin-rtr.entrypoints=web,websecure
      - traefik.http.routers.jellyfin-rtr.rule=Host(`jellyfin.$DOMAINNAME`)
      - traefik.http.routers.jellyfin-rtr.service=jellyfin-svc
      - traefik.http.services.jellyfin-svc.loadbalancer.server.port=8096
