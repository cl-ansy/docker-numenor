services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - t3_proxy
      - socket_proxy
    volumes:
      - $DOCKERDIR/appdata/homepage:/app/config
      - $DOCKERDIR/logs/homepage:/app/logs
      # The resources widget reads filesystems from inside this container, so any
      # disk it should report has to be mounted here. Read-only.
      - $SHAREDDIR:/mnt/shared:ro
    environment:
      TZ: $TZ
      PUID: $PUID
      PGID: $PGID
      # Required since homepage v0.9.0 or it refuses requests with a host validation error
      HOMEPAGE_ALLOWED_HOSTS: $DOMAINNAME,www.$DOMAINNAME
      # Referenced as {{HOMEPAGE_VAR_*}} in appdata/homepage/*.yaml.
      # Infrastructure is addressed by IP because $DOMAINNAME resolves to Traefik
      # only - see runbooks/access.md. Values live in .env so they stay out of git.
      HOMEPAGE_VAR_DOMAIN: $DOMAINNAME
      HOMEPAGE_VAR_CIMC: $CIMC_HOST
      HOMEPAGE_VAR_PVE: $PVE_HOST
      HOMEPAGE_VAR_NAS: $NAS_HOST
      HOMEPAGE_VAR_OPNSENSE: $OPNSENSE_HOST
      # Widget API keys. Previously these sat in homepage.widget.key labels on
      # the service containers, where anything with docker inspect could read
      # them. Now they exist only here.
      HOMEPAGE_VAR_RADARR_KEY: $RADARR_API_KEY
      HOMEPAGE_VAR_SONARR_KEY: $SONARR_API_KEY
      HOMEPAGE_VAR_SABNZBD_KEY: $SABNZBD_API_KEY
      HOMEPAGE_VAR_JELLYFIN_KEY: $JELLYFIN_API_KEY
    labels:
      - traefik.enable=true
      - traefik.http.routers.homepage-rtr.entrypoints=websecure
      - traefik.http.routers.homepage-rtr.rule=Host(`$DOMAINNAME`) || Host(`www.$DOMAINNAME`)
      - traefik.http.routers.homepage-rtr.service=homepage-svc
      - traefik.http.routers.homepage-rtr.middlewares=chain-authentik@file
      - traefik.http.services.homepage-svc.loadbalancer.server.port=3000
      - traefik.docker.network=t3_proxy

